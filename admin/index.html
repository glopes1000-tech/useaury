<!-- Seção: Nova Categoria -->
<div class="mb-6 p-4 bg-wine-50/50 rounded-xl border border-wine-100">
    <h4 class="font-bold text-wine-950 text-xs uppercase tracking-wider mb-2">Cadastrar Nova Categoria</h4>
    <form onsubmit="saveCategoryToFirebase(event)" class="flex gap-2 text-xs">
        <input type="text" id="cat-name" required placeholder="Nome da Categoria" class="flex-grow p-2.5 border rounded-lg text-xs bg-white">
        <button type="submit" class="px-4 py-2.5 bg-gold-500 hover:bg-gold-600 text-wine-950 font-bold uppercase rounded-lg transition shrink-0">Cadastrar</button>
    </form>
    <div class="mt-3">
        <span class="text-[10px] text-gray-500 font-semibold">Categorias Atuais:</span>
        <div id="admin-categories-list" class="max-h-28 overflow-y-auto mt-1 text-xs"></div>
    </div>
</div>
